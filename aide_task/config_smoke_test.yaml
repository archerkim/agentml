# Одноразовый конфиг для проверки run_with_early_stop.py на штатном примере из
# самого aideml (house_prices, идёт в комплекте с пакетом) - НЕ имеет отношения к
# KuaiRand, нужен только чтобы убедиться, что скрипт реально проходит полный цикл
# draft -> execute -> evaluate -> save -> report на вашей связке aideml + Gemini,
# прежде чем тратить бюджет на настоящий прогон (config.yaml).
#
# "example_tasks/..." - специальный префикс, aideml сам резолвит его относительно
# своей собственной install-директории (см. prep_cfg в aide/utils/config.py) - не
# нужно искать путь в site-packages руками.
data_dir: example_tasks/house_prices
desc_file: null
goal: "Predict the sales price for each house."
eval: "RMSE between log-prices."

log_dir: logs_smoke_test
workspace_dir: workspaces_smoke_test

preprocess_data: True
copy_data: True

exp_name: smoke-test

exec:
  timeout: 120
  agent_file_name: runfile.py
  format_tb_ipython: False

generate_report: True
report:
  model: gemini-3.5-flash-lite
  temp: 1.0

agent:
  steps: 3
  k_fold_validation: 1
  expose_prediction: False
  data_preview: True

  code:
    model: gemini-3.6-flash
    temp: 0.5

  feedback:
    model: gemini-3.5-flash-lite
    temp: 0.5

  search:
    max_debug_depth: 2
    debug_prob: 0.5
    num_drafts: 1

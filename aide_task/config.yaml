# AIDE config для KuaiRand-Pure.
# Схема сверена с локально установленным pip-пакетом aideml==0.2.2
# (aide/utils/config.py: AgentConfig) - у GitHub main есть поля (напр. metric_maximize),
# которых в этой версии на PyPI ещё нет; ориентируйтесь на установленную версию, не на main.
#
# LLM-провайдер: локальный Ollama, модель aide-qwen3.8:27b (Qwen 3.8 27B).
# aideml==0.2.2 распознаёт провайдера только по паттернам "gpt-"/"o<N>"/"codex-",
# "claude-", "gemini-" (aide/backend/__init__.py:determine_provider) -
# "aide-qwen3.8:27b" ни под один не попадает, поэтому провайдер попадает
# в ветку "если задан OPENAI_BASE_URL - используем backend_openai.py по обычному Chat
# Completions API". aide_task/.env задаёт локальный OpenAI-совместимый endpoint
# sidecar'а; он направляет запросы в Ollama и принудительно выставляет
# reasoning_effort=max. Не менять endpoint на прямой :11434/v1: тогда AIDE не передаст
# этот параметр и Qwen будет работать с обычной глубиной рассуждений.
#
# Локальный alias использует уже импортированные веса qwen3.8:27b и задаёт runtime
# context 131072 (см. Modelfile.aide-qwen3.8). 32K, стоявшие здесь раньше, НЕ работают
# на maximum reasoning: замерено на реальном draft-промпте - prompt 7052 токенов,
# completion 25716, total ровно 32768, finish_reason="length", content пустой. Модель
# тратила весь остаток контекста на reasoning и не успевала выдать ответ, из-за чего
# AIDE записывал кандидата с кодом нулевой длины (logs/5-kuairand-pure-run1, шаги 1-2).
# 131072 умещается целиком в GPU (23 ГБ, 100% GPU на двух A5000).
#
# Запускайте через ./run_kuairand.sh - он поднимает ollama_max_reasoning_proxy.py и,
# что важнее, АКТИВИРУЕТ venv: verify_candidate() и ensemble-шаг вызывают `python3`
# через PATH, и без активации это /usr/bin/python3 без pandas.

data_dir: ./data
desc_file: ./description.md
# goal/eval - альтернатива desc_file (см. house_prices пример). Мы используем desc_file,
# но load_task_desc() в aideml==0.2.2 всё равно ЧИТАЕТ cfg.goal/cfg.eval (просто чтобы
# решить, печатать ли warning про "ignoring goal/eval") - без явного null они остаются
# MISSING в структурированном OmegaConf-конфиге и падают с MissingMandatoryValue при
# первом же обращении. Явный null - обязателен, если используете desc_file.
goal: null
eval: null

log_dir: logs
workspace_dir: workspaces

# файлы уже подготовлены prepare_data.py (train/valid/test с вырезанными outcome-
# колонками) - архивов внутри нет, распаковывать нечего
preprocess_data: False
# копировать, не симлинкать - чтобы агент не мог случайно испортить мастер-копию
# data_dir (единственную маскированную версию, которая у нас есть)
copy_data: True

exp_name: kuairand-pure-run1

exec:
  # хард-кап на ОДНО выполнение кода агента. Поднято с 900 до 2700 после того, как
  # 900с стали связывающим ограничением, а не страховкой: директивы требуют внутренних
  # свипов по гиперпараметрам, и кандидаты убивались по таймауту ДО того, как успевали
  # что-либо посчитать - directive 02 step 1 (9 обучений BPR) и directive 03 step 2
  # (torch DeepFM на CPU). Это скрывало реальный результат за таймаутом.
  timeout: 2700
  agent_file_name: runfile.py
  format_tb_ipython: False

generate_report: True
report:
  model: aide-qwen3.8:27b
  temp: 1.0

agent:
  # = 50-iteration cap из спеки соревнования - жёсткий верхний потолок.
  # Реальный ранний останов по плато (ε=0.002/N=3) и wall-clock ceiling (6ч)
  # реализованы отдельно в run_with_early_stop.py - запускайте через него,
  # а не через нативный `aide ...`, если хотите, чтобы прогон останавливался
  # раньше 50 шагов при выходе на плато.
  steps: 50   # жёсткий потолок итераций из спеки соревнования

  # у нас фиксированный date-based train/valid/test, а не k-fold CV - не давать
  # AIDE самому придумывать свой CV поверх train.csv
  k_fold_validation: 1

  # финальное решение должно уметь применяться к test.csv и производить submission.csv
  # (см. "Формат финального сабмита" в description.md) - это и есть designated final
  expose_prediction: True

  data_preview: True

  code:
    model: aide-qwen3.8:27b
    temp: 0.5

  feedback:
    model: aide-qwen3.8:27b
    temp: 0.5

  search:
    max_debug_depth: 3
    debug_prob: 0.5
    # 1 = НИКАКИХ черновиков с нуля: единственный узел без родителя - это засеянный
    # FM baseline, всё остальное строится ОТ НЕГО.
    #
    # Механика (aide/agent.py:search_policy + journal.py:draft_nodes): draft_nodes -
    # это узлы с parent is None, а seed-узел как раз такой, поэтому он сам считается
    # за один черновик. Условие `len(draft_nodes) < num_drafts` при num_drafts=1
    # ложно уже на первом шаге, так что _draft() не вызывается никогда; policy идёт
    # в debug багованного листа либо в _improve(get_best_node()) - то есть правит
    # baseline точечными SEARCH/REPLACE-патчами.
    #
    # Почему поменяли с 5: на прогонах 6-8 обязательные черновики съедали
    # большую часть бюджета и почти все падали (KeyError/ValueError/IndexError -
    # модель пишет фичи по несуществующим колонкам), лучший из них дал 0.5937
    # против baseline 0.6015. За 8 шагов прогона 8 ровно ОДИН шаг дошёл до
    # улучшения baseline. Теперь на это идут все шаги.
    #
    # Цена: ensemble-шаг в конце почти наверняка пропустится - select_diverse_topk
    # требует >=2 РАЗНЫХ lineage, а теперь lineage один. Это осознанный размен:
    # ансамбль из прошлого прогона всё равно дал 0.5937 (100% веса на один
    # кандидат, второй бесполезен), т.е. терять почти нечего.
    num_drafts: 1
